<VirtualHost *:80>
  DocumentRoot /phpipam
  Alias "/xhprof" "/xhprof/xhprof_html"
  php_admin_value auto_prepend_file /xhprof/header.php
</VirtualHost>

<Directory "/phpipam">
  AllowOverride All
  Options FollowSymLinks
  Require all granted
</Directory>

<Directory "/xhprof">
  AllowOverride All
  Options FollowSymLinks
  Require all granted
</Directory>
